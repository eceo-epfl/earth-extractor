[project]
name = "earth-extractor"
version = "0.4.0"
description = "A library to simplify the workflow of data acquisition from multiple satellite data providers"
authors = [{ name = "Evan Thomas", email = "evan.thomas@epfl.ch" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.3.5",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "keyring>=24.2.0",
    "shapely>=2.0.1",
    "tenacity>=8.2.2",
    "geopandas>=0.13.2",
    "pystac-client>=0.8.0",
    "aiohttp>=3.10.0",
    "pyjwt>=2.8.0",
    "orjson>=3.9.5",
    "tqdm>=4.66.1",
    "geojson>=3.1.0",
    "asf-search>=7.0.4",
    "requests>=2.31.0",
    "pyproj>=3.6.0",
]

[project.scripts]
earth-extractor = "earth_extractor.app:main"

[dependency-groups]
dev = [
    "mypy>=1.3.0",
    "jupyterlab>=4.0.2",
    "pytest>=8.0.0",
    "pytest-mock>=3.11.1",
    "pytest-cov>=4.1.0",
    "pytest-watcher>=0.3.4",
    "requests-mock>=1.11.0",
    "pytest-env>=1.0.1",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing --ignore=tests/e2e"
env = ["PYTHON_KEYRING_BACKEND = keyring.backends.null.Keyring"]
markers = ["e2e: end-to-end tests requiring live API credentials"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
